<html>
  <title>25</title>

  <script language="JavaScript">
  <!--
    /******************************************
    //グローバル変数
    *******************************************/
    var num  = new Array();      //パネル配置データ
    var game = false;            //ゲーム中フラグ
    var time = 0;                //ゲーム経過時間
    var timeID = 0;              //タイマID

    /******************************************
    //関数inipanel() パネルを初期化
    *******************************************/
    function inipanel(){
      var i   = 0;              //ループ用

      //パネル初期化
      for(i=0;i<25;i++){
        num[i] = i+1;
        eval("document.img"+i+".src='image/"+num[i]+".gif'");
      }

      //ボタンをstartボタンに
      document.f.b.value = "START";

      game = false;
    }

    /******************************************
    //関数makepanel() パネルをランダムに配置
    *******************************************/
    function makepanel(){
      var i   = 0;              //ループ用１
      var j   = 0;              //ループ用２

      //ゲーム中ならば中止処理
      if(game){
        //タイマ停止
        clearInterval(timeID);

        inipanel();
        return;
      }

      //番号が重複しないように配置
      for(i=0;i<25;i++){
        num[i] = Math.floor(Math.random()*25)+1;
        if(i!=0){
          for(j=0;j<i;j++){
            if(num[i]==num[j]){
              i--;
            }
          }
        }
      }

      //パネル表示
      for(i=0;i<25;i++){
        eval("document.img"+i+".src='image/"+num[i]+".gif'");
      }

      //startボタンをstopボタンに
      document.f.b.value = "STOP";

      //タイマースタート
      time = 0;
      timeID = setInterval("countup()",1000);
      document.f.t.value = 0;

      game = true;
    }

    /**********************************************
    //関数point() マウスがパネルを指したときの処理
    ***********************************************/
    function point(x,y){
    }

    /**********************************************
    //関数push() マウスクリック処理
    ***********************************************/
    function push(x,y){
      var okflag = false;      //移動可能フラグ
      var dx     = 0;          //移動方向横
      var dy     = 0;          //移動方向縦
      var nn     = 0;          //移動先番号
      var on     = 0;          //移動元番号
      var best   = 0;          //最短時間

      if(!game){
        return;
      }

      //隣にあきがあるか
      if(x!=0){
        if(num[y*5+x-1]==25){
          okflag=true;
          dx=-1;
        }
      }
      if(x!=4){
        if(num[y*5+x+1]==25){
          okflag=true;
          dx=1;
        }
      }
      if(y!=0){
        if(num[(y-1)*5+x]==25){
          okflag=true;
          dy=-1;
        }
      }
      if(y!=4){
        if(num[(y+1)*5+x]==25){
          okflag=true;
          dy=1;
        }
      }

      //移動処理
      if(okflag){
        nn = (y+dy)*5+x+dx;
        on = y*5+x;

        num[nn] = num[on];
        num[on] = 25;

        eval("document.img"+nn+".src='image/"+num[nn]+".gif'");
        eval("document.img"+on+".src='image/25.gif'");

        if(check()){
          //完成時処理
          alert("おめでとう！");

          //タイマ停止
          clearInterval(timeID);

          //Cookie取得（最短時間）
          best = getCookie("time");
          if(best==""){
            best = 99999;
          }

          //ゲーム最短時間更新
          if(time<best){
            alert("あなたは自己ベストを記録しました。");
            setCookie("time",time);
          }
          else{
            alert("自己ベストまで後"+(time-best)+"秒でした。");
          }

          inipanel();
        }
      }
    }

    /**********************************************
    //関数check() 仕上がりチェック処理
    //  戻り値：  true     上がり
    //            false    上がりでない
    ***********************************************/
    function check(){
      var i    = 0;       //ループ用
      var flag = true;    //判定フラグ

      for(i=0;i<25;i++){
        if(num[i]!=i+1){
          flag=false;
        }
      }
      return flag;
    }

    /**********************************************
    //関数getCookie() Cookie読み込み処理
    //  引数　：key 読み込み情報キー
    //  戻り値：    キーに対応する値
    ***********************************************/
    function getCookie(key){
      var tmp3 = "";    //キーに対応する値（戻り値）
      var tmp2 = "";    //分離された「キー=値」の文字列
      var tmp1 = "";    //取得されたCookie
      var kp = 0;       //キーのワード先頭位置
      var sp = 0;       //セミコロン位置
      var ep = 0;       //イコール位置

      tmp1 = " " + document.cookie + ";";

      kp = tmp1.indexOf(key);
      if(kp>=0){
        sp = tmp1.indexOf(";",kp);
        if(sp>=0){
          tmp2 = tmp1.substring(kp,sp);
          ep = tmp2.indexOf("=");
          if(ep>=0){
            tmp3 = unescape(tmp2.substring(ep+1,sp));
          }
        }
      }
      return(tmp3);
    }

    /**********************************************
    //関数setCookie() Cookie書き込み処理
    //  引数　：key 書き込み情報キー
    //  　　　：val 値
    //  戻り値：なし
    ***********************************************/
    function setCookie(key,val){
      tmp = key + "=" + escape(val) + "; ";
      tmp += "expires=Fri, 31-Dec-2030 23:59:59; ";
      document.cookie = tmp;
    }

    /**********************************************
    //関数countup() タイマーカウントアップ処理
    //  引数　：なし
    //  戻り値：なし
    ***********************************************/
    function countup(){
      time=time+1;
      document.f.t.value = time;
    }

  //-->
  </script>

<body bgcolor="#fff0d0">
<center>
  <h1><font color="green">暇つぶし。</font></h1>
  <b>
    JavaScriptのサンプルです。作ってみました。<br>
    いわゆる、パネルを１枚ずつ動かして数字を左上から順番に並べるゲームです。<br>
    下の「START」ボタンをクリックして開始してください。<br>
    空白の隣のパネルをクリックすると、動かすことができます。<br>
  </b>
  <br>

          <td><img src="image/2.gif" name="img1" onMousover="point(1,0)" onClick="push(1,0)"></td>
          <td><img src="image/3.gif" name="img2" onMousover="point(2,0)" onClick="push(2,0)"></td>

          <td><img src="image/7.gif" name="img6" onMousover="point(1,1)" onClick="push(1,1)"></td>

          <td><img src="image/9.gif" name="img8" onMousover="point(3,1)" onClick="push(3,1)"></td>
          <td><img src="image/10.gif" name="img9" onMousover="point(4,1)" onClick="push(4,1)"></td>
      </tr>
      <tr><td><img src="image/11.gif" name="img10" onMousover="point(0,2)" onClick="push(0,2)"></td>
          <td><img src="image/12.gif" name="img11" onMousover="point(1,2)" onClick="push(1,2)"></td>
          <td><img src="image/13.gif" name="img12" onMousover="point(2,2)" onClick="push(2,2)"></td>
          <td><img src="image/14.gif" name="img13" onMousover="point(3,2)" onClick="push(3,2)"></td>
          <td><img src="image/15.gif" name="img14" onMousover="point(4,2)" onClick="push(4,2)"></td>
      </tr>
      <tr><td><img src="image/16.gif" name="img15" onMousover="point(0,3)" onClick="push(0,3)"></td>
          <td><img src="image/17.gif" name="img16" onMousover="point(1,3)" onClick="push(1,3)"></td>
          <td><img src="image/18.gif" name="img17" onMousover="point(2,3)" onClick="push(2,3)"></td>
          <td><img src="image/19.gif" name="img18" onMousover="point(3,3)" onClick="push(3,3)"></td>
          <td><img src="image/20.gif" name="img19" onMousover="point(4,3)" onClick="push(4,3)"></td>
      </tr>
      <tr><td><img src="image/21.gif" name="img20" onMousover="point(0,4)" onClick="push(0,4)"></td>
          <td><img src="image/22.gif" name="img21" onMousover="point(1,4)" onClick="push(1,4)"></td>
          <td><img src="image/23.gif" name="img22" onMousover="point(2,4)" onClick="push(2,4)"></td>
          <td><img src="image/24.gif" name="img23" onMousover="point(3,4)" onClick="push(3,4)"></td>
          <td><img src="image/25.gif" name="img24" onMousover="point(4,4)" onClick="push(4,4)"></td>
      </tr>
    </table>
    <br>
    <form name="f">
      <input type="text" name="t" value="0" size=4>秒<br>
      <br>
      <input type="button" value="START" name="b" onClick="makepanel()">
    </form>
</center>
</body>
